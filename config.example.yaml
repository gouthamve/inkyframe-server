# inkyframe-server configuration.
# Copy to config.yaml and edit. Run with: go run . -config config.yaml

listen_addr: ":8080"      # HTTP listen address (default :8080)
rotate: true              # if true, /image advances to the next app each request (default true)
dither: floyd-steinberg   # dithering algorithm: floyd-steinberg (default) or atkinson

apps:
  # The default app is the first one listed.
  - name: family-photos
    type: immich
    immich:
      url: https://immich.example.com   # Immich server base URL
      api_key: your-api-key             # needs asset.view + album read; keep secret
      album_id: your-album-uuid         # album to pull images from

  # A "movie" app plays a whole video file one frame at a time: /next-image
  # advances a frame, /prev-image steps back (clamped at the ends). /image shows
  # the current frame without advancing. Frames are decoded on demand by seeking
  # with ffmpeg, so memory stays low no matter how long the film is. Requires
  # ffmpeg and ffprobe on PATH.
  # - name: holiday-clip
  #   type: movie
  #   movie:
  #     path: /movies/holiday.mp4        # any ffmpeg-decodable video
  #     # fps: 2                         # optional: sample N frames/sec; omit for native (every frame)
  #     state_file: /state/holiday.idx   # optional: persist position to resume on restart (writable path)
